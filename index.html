<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ERIT 360° San Miguel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: app móvil naranja y gris. Barra superior grafito, pestañas abajo (Supervisora: Hoy · Equipo · Medir / Gestor: Mi ruta · Incidencias).
   El mapa es el centro: la supervisora lo usa para decidir, el gestor para llegar a su tarea. */
:root{
  --bg:#F3F4F5; --surf:#FFFFFF; --surf2:#E9EBED; --fg:#24272B; --mut:#6B7078; --line:#DADDE1;
  --ink:#282B30; --inkfg:#FFFFFF;
  --acc:#F05A28; --accfg:#FFFFFF; --heat:#FF7A32; --acct:#C9481E;
  --ok:#238A5A; --bad:#D64545; --info:#3268D8; --warn:#D68A00;
  --f-head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1D1F; --surf:#292B2E; --surf2:#35383C; --fg:#F0F0EE; --mut:#A8ABB0; --line:#3E4146;
  --ink:#131415; --inkfg:#FFFFFF; --acc:#FF7A2E; --accfg:#1A0E05; --heat:#FF8A3D; --acct:#FF9A55;
  --ok:#5CC265; --bad:#FF7777; --info:#7EB0F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1D1F; --surf:#292B2E; --surf2:#35383C; --fg:#F0F0EE; --mut:#A8ABB0; --line:#3E4146;
  --ink:#131415; --inkfg:#FFFFFF; --acc:#FF7A2E; --accfg:#1A0E05; --heat:#FF8A3D; --acct:#FF9A55;
  --ok:#5CC265; --bad:#FF7777; --info:#7EB0F0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.35}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,#24272B,#34383E);color:var(--inkfg);border-bottom:3px solid var(--heat);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header h1{font:700 22px/1 var(--f-head);letter-spacing:.03em;margin:0;text-transform:uppercase}
header .sub{font-size:12px;opacity:.8;margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA0A6;display:inline-block}
.dot.on{background:#5CC265}.dot.ro{background:#FFB020}
.who{border:1px solid #ffffff55;background:#ffffff14;color:var(--inkfg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datebar{display:flex;align-items:center;gap:6px;padding:12px 16px 0}
.datebar button{height:38px;min-width:38px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:700;font-size:15px}
.datebar input{flex:1;min-width:0;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surf);padding:0 10px;text-align:center;font-weight:700}
main{padding:14px 16px 100px;display:flex;flex-direction:column;gap:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
nav button{border:0;background:none;padding:8px 2px;border-radius:12px;font:700 12.5px var(--f-body);color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button[aria-current="true"]{color:var(--acct);background:color-mix(in srgb,var(--heat) 16%,transparent)}
h2{font:700 17px/1.1 var(--f-head);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--mut)}
h3{font:700 24px/1.05 var(--f-head);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 10px #00000008}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;min-width:0}
.tile b{display:block;font:700 28px/1 var(--f-head);font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--mut);line-height:1.1;display:block;margin-top:4px;font-weight:600}
.tile.hot b{color:var(--bad)}
.tile.act{border-color:var(--heat);cursor:pointer}
.tile[aria-pressed="true"]{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.tile[aria-pressed="true"] span{color:#ffffffcc}
.seg{display:flex;background:var(--surf2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--fg);box-shadow:0 1px 3px #0003}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-size:17px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--inkfg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.lnk{border:0;background:none;color:var(--acct);font-weight:700;text-decoration:underline;padding:8px;align-self:center}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.tag.crit{background:var(--bad);color:#fff}
.tag.tn{background:var(--surf2);color:var(--mut)}
.map{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:6px}
.map svg{display:block;width:100%;height:auto}
.map .z{stroke:var(--surf);stroke-width:1.5;cursor:pointer}
.map .zt{font:800 8.5px var(--f-body);text-anchor:middle;pointer-events:none}
.map .zm{font:700 8px var(--f-body);text-anchor:middle;pointer-events:none}
.map g.dim{opacity:.3}
.map .mine{stroke:var(--ink);stroke-width:2.8}
.map .route{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:5 4;stroke-linejoin:round}
.map .stop circle{fill:var(--ink);stroke:#fff;stroke-width:1.6}
.map .stop text{fill:#fff;font:800 10px var(--f-body);text-anchor:middle}
.map .bdg circle{fill:var(--ink);stroke:#fff;stroke-width:1.2}
.map .bdg text{fill:#fff;font:800 8px var(--f-body);text-anchor:middle}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);padding:4px 6px 2px;font-weight:600}
.legend i{height:8px;flex:1;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--heat) 8%,var(--surf)),var(--heat))}
.legend.q i{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 8%,var(--surf)),var(--bad))}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.P{background:var(--surf2);color:var(--mut)}
.pill.E{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.pill.R{background:var(--heat);color:#1A0E05}
.pill.V{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.C{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.L{background:var(--bad);color:#fff}
.trow{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.trow.late{border-color:var(--bad)}
.tm{font:700 18px/1 var(--f-head);min-width:46px;font-variant-numeric:tabular-nums}
.tt{font-weight:800}
.meta{font-size:12.5px;color:var(--mut)}
.dec{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dec.late{border-color:var(--bad)}
.dec .top{display:flex;gap:10px;align-items:center;cursor:pointer}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--surf2);flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.qt{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.qt.Q1{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.qt.Q2{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.qt.Q3{background:color-mix(in srgb,var(--heat) 22%,transparent);color:var(--acct)}
.qt.Q4{background:var(--surf2);color:var(--mut)}
.mx{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:stretch}
.mx .ax{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);text-align:center;align-self:end}
.mx .ay{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut);align-self:center;justify-self:center}
.qc{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:11px 10px;min-width:0}
.qc b{font:700 32px/1 var(--f-head);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.qc .tt{font-size:15px}
.qc .small{color:var(--mut);line-height:1.15}
.qc.Q1 b{color:var(--bad)}.qc.Q1{border-color:var(--bad)}
.qc.Q2 b{color:var(--info)}.qc.Q3 b{color:var(--acct)}.qc.Q4 b{color:var(--mut)}
.qc[aria-pressed="true"]{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.qc[aria-pressed="true"] .small{color:#ffffffcc}.qc[aria-pressed="true"] b{color:var(--inkfg)}
.bar{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font:700 36px/1 var(--f-head);font-variant-numeric:tabular-nums}
.kpi .f{font-size:11.5px;color:var(--mut);line-height:1.25}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:4px 6px}
.tbl td{padding:7px 6px;border-top:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--mut)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:11px 12px;font-weight:600;color:var(--fg);font-size:16px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:800;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--bad)}
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#000a}
#sheet.on{display:flex}
#sheet .pane{background:var(--bg);width:100%;max-width:560px;max-height:93%;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--inkfg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--acc);color:var(--accfg);border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:16px;box-shadow:0 4px 16px #0005}
.ck{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ck .seg{width:156px}
.ck .seg button{padding:7px 2px;font-size:12.5px}
.ck .seg button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.ck .seg button[aria-pressed="true"].fail{background:var(--bad);color:#fff}
.note{background:color-mix(in srgb,var(--heat) 14%,var(--surf));border:1px solid color-mix(in srgb,var(--heat) 40%,var(--line));border-radius:14px;padding:11px 13px;font-size:13.5px}
.empty{padding:22px 12px;text-align:center;color:var(--mut);font-size:14px}
.hero{background:linear-gradient(145deg,#25282D,#393D43);color:var(--inkfg);border-radius:22px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px #0002}
.hero .k{font:700 14px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--heat)}
.hero h3{font-size:30px}
.hero .meta{color:#ffffffcc;font-size:14px}
.hero.done{background:var(--surf);color:var(--fg);border:1px solid var(--line)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--heat) calc(var(--p)*1%),var(--surf2) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 16px var(--f-head)}
.greet{display:flex;gap:14px;align-items:center}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.phs .ph{position:relative;width:96px;height:96px}
.phs .ph img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.phs .ph button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-weight:800}
.shot{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--heat);border-radius:16px;padding:18px;font-weight:800;color:var(--acct);cursor:pointer;background:color-mix(in srgb,var(--heat) 8%,var(--surf))}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.evid{width:100%;border-radius:14px;display:block}
.acc-h{display:flex;gap:10px;align-items:center;cursor:pointer}
.sub-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
textarea.pk{width:100%;height:110px;font:12px monospace;border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:8px}

.pulse{background:linear-gradient(145deg,#25282D,#353A40);color:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 28px #0002;display:flex;flex-direction:column;gap:14px}
.pulse .eyebrow{font:800 12px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:#FFC2A4}
.pulse h3{font-size:30px}.pulse .mut{color:#ffffffbf}
.pulse-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pulse-m{background:#ffffff10;border:1px solid #ffffff20;border-radius:13px;padding:9px 7px;text-align:center;min-width:0}
.pulse-m b{display:block;font:700 24px/1 var(--f-head);font-variant-numeric:tabular-nums}.pulse-m span{display:block;font-size:10.5px;color:#ffffffc7;margin-top:4px;line-height:1.1}
.quickbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quickbar .btn{padding:11px 10px}
.kpi6{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi2{position:relative;overflow:hidden}.kpi2 .v{font:700 34px/1 var(--f-head);font-variant-numeric:tabular-nums}.kpi2 .goal{font-size:11.5px;color:var(--mut);margin-top:5px}.kpi2 .state{position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.kpi2.good .state{background:var(--ok)}.kpi2.warn .state{background:var(--warn)}.kpi2.bad .state{background:var(--bad)}
.callout{border-left:4px solid var(--heat);padding-left:12px}.callout.good{border-color:var(--ok)}.callout.bad{border-color:var(--bad)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.flow div{background:var(--surf2);border-radius:12px;padding:9px 6px;text-align:center;font-size:11px;font-weight:800}.flow b{display:block;font:700 20px/1 var(--f-head);margin-bottom:3px}
.load{height:7px;background:var(--surf2);border-radius:999px;overflow:hidden;margin-top:5px}.load i{display:block;height:100%;background:var(--heat);border-radius:999px}
@media(max-width:390px){.pulse-grid{grid-template-columns:1fr 1fr}.pulse-m b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let DB=null;const SYNC={s:'off'};
const PEND=new Map();let busy=false;
function dbPut(path,obj){if(!DB)return;PEND.set(path,clone(obj));pump()}
async function pump(){
  if(busy)return;busy=true;
  while(PEND.size&&DB){
    const batch=[...PEND.entries()].slice(0,8);batch.forEach(([p])=>PEND.delete(p));
    let stop='';
    await Promise.all(batch.map(async([p,o])=>{
      try{await DB.doc(p).set(o)}
      catch(e){const c=e&&e.code;
        if(c==='resource_exhausted'||c==='resource-exhausted'||c==='unavailable'){if(!PEND.has(p))PEND.set(p,o);stop=stop||'wait'}
        else if(c==='invalid_argument'||c==='permission-denied'){if(p.indexOf('team/')===0)return;SYNC.s='ro';PEND.clear();hdr();toast('No tienes permiso para guardar. Avisa a tu supervisora.');stop='ro'}
        else if(c==='quota_exceeded'){toast('Se llenó el almacenamiento');PEND.clear();stop='ro'}}
    }));
    if(stop==='ro')break;if(stop==='wait')await sleep(1500);
  }
  busy=false;
}

function mergeOne(arr,d){
  const i=arr.findIndex(x=>x.id===d.id);
  if(i<0){arr.push(d);return true}
  if((d.u||0)>(arr[i].u||0)){arr[i]=d;return true}
  return false;
}

    if(!c.length)return null;
    c.sort((a,b)=>load[a.id]-load[b.id]);load[c[0].id]+=w;return c[0];
  };
  const add=(type,zone,time,turnos,note)=>{

  add('cabeceras','MUEBLES',660,['MA','PM']);
  add('gancheras','FERRETERIA',640,['MA','PM']);
  add('gancheras','ELECTRICIDAD',660,['MA','PM']);
  add('estacional','AIRE LIBRE Y TEMPORADA',600,['MA','PM']);

  add('checkout','ENTRADA',540,['MA','PM']);
  add('showroom','MUEBLES',700,['MA','PM']);

  top(3).forEach((z,i)=>add('easyfind',z,680+i*20,['MA','PM']));

  top(2).forEach((z,i)=>add('implementacion',z,840+i*30,['T1']));

  top(5).forEach((z,i)=>add('metro',z,1035+i*20,['T2','T1']));

function mapSVG(o){
  const mode=o.mode||'ventas',mine=o.mine||null,route=o.route||[],money=!!o.money;
  const ts=dayTasks(),by={};ts.forEach(t=>{(by[t.zone]=by[t.zone]||[]).push(t)});
  let s='<svg viewBox="0 0 360 520" role="img" aria-label="Mapa de la tienda por áreas">';
  ZONES.forEach(z=>{
    const a=AREAS[z.id],zt=by[z.id]||[];
    let fill='var(--surf2)',txt='var(--fg)',metric='';
    const heatT=a?(money?a.s/MAXS:1-(a.rank-1)/19):0;
    if((mode==='ventas'||mode==='ruta')&&a){
      fill=`color-mix(in srgb,var(--heat) ${Math.round(8+heatT*78)}%,var(--surf))`;if(heatT>.45)txt='#1F2023';
      metric=mode==='ventas'&&money?'#'+a.rank+' · S/ '+fmtS(a.s):'#'+a.rank;
    }else if(mode==='quiebres'&&a){const t=a.nq/MAXQ;fill=`color-mix(in srgb,var(--bad) ${Math.round(8+t*72)}%,var(--surf))`;if(t>.55)txt='#fff';metric=a.nq+' quiebres'}
    else if(mode==='avance'){
      const v=zt.filter(t=>t.s==='V').length,bad=zt.some(t=>t.s==='C'||isLate(t));
      if(zt.length){metric=v+'/'+zt.length;
        if(bad)fill='color-mix(in srgb,var(--bad) 55%,var(--surf))';
        else if(v===zt.length)fill='color-mix(in srgb,var(--ok) 55%,var(--surf))';
        else fill='color-mix(in srgb,var(--heat) 40%,var(--surf))';}
    }
    const isMine=mine&&zt.some(t=>mine.has(t.id));
    const gd=mine&&!isMine?' class="dim"':'';
    s+=`<g${gd} data-z="${esc(z.id)}"><rect class="z${isMine?' mine':''}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" style="fill:${fill}"/>`;
    if(z.bar)s+=`<text class="zt" x="${z.x+z.w/2}" y="${z.y+z.h/2+3}" style="fill:${txt};font-size:8px">${esc(z.l[0])}</text>`;
    else{
      const lines=z.l.length+(metric?1:0);const y=z.y+z.h/2-(lines-1)*5.5+3;
      s+=`<text class="zt" x="${z.x+z.w/2}" style="fill:${txt};${z.fs?'font-size:'+z.fs+'px':''}">`;
      z.l.forEach((ln,i)=>{s+=`<tspan x="${z.x+z.w/2}" y="${y+i*11}">${esc(ln)}</tspan>`});
      s+='</text>';
      if(metric)s+=`<text class="zm" x="${z.x+z.w/2}" y="${y+z.l.length*11}" style="fill:${txt}">${esc(metric)}</text>`;
    }
    const open=zt.filter(isOpen).length;
    if(o.badges&&open){const cx=z.x+z.w-9,cy=z.y+9;s+=`<g class="bdg"><circle cx="${cx}" cy="${cy}" r="8"/><text x="${cx}" y="${cy+3}">${open}</text></g>`}
    s+='</g>';
  });
  if(route.length){

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const M=600,k=Math.min(1,M/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.55))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

 ruta:'M5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM7 17h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6',
 inc:'M12 3l10 18H2zM12 10v5M12 18v.5'};
const TABS={sup:[['hoy','Hoy'],['equipo','Equipo'],['medir','Control']],ges:[['ruta','Mi ruta'],['inc','Incidencias']]};
function render(){
  if(!USER){loginSheet();hdr();return}
  if(!resolveRole()){unassignedSheet();hdr();return}
  if(UI.lock){UI.lock=false;$('#sheet').classList.remove('on')}
  const tabs=TABS[S.role];if(!tabs.some(t=>t[0]===UI.tab))UI.tab=tabs[0][0];
  $('#whoBtn').textContent=isSup()?'Supervisora':(person(S.me)?person(S.me).name:'Elegir nombre');
  hdr();
  $('#nav').innerHTML=tabs.map(t=>`<button data-act="tab" data-t="${t[0]}" aria-current="${UI.tab===t[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[t[0]]}"/></svg>${t[1]}</button>`).join('');
  const showDate=UI.tab==='hoy'||UI.tab==='equipo'||UI.tab==='ruta';
  $('#datebar').hidden=!showDate;
  $('#datebar').innerHTML=`<button data-act="day" data-n="-1" aria-label="Día anterior">‹</button><input type="date" id="dayI" value="${S.date}" data-chg="date" aria-label="Fecha"><button data-act="day" data-n="1" aria-label="Día siguiente">›</button><button data-act="day" data-n="0" style="padding:0 12px">Hoy</button>`;
  const V={hoy:vHoy,equipo:vEquipo,medir:vMedir,ruta:vRuta,inc:vIncG};
  $('#main').innerHTML=V[UI.tab]();
}
const ACTS={
 close:()=>closeSheet(),
 tab:el=>{UI.tab=el.dataset.t;render();window.scrollTo(0,0)},
 roleSheet:()=>roleSheet(false),
 setRole:el=>{
  if(el.dataset.r==='sup'&&!canSup())return;
  UI.lock=false;S.role=el.dataset.r;if(S.role==='ges')S.me=el.dataset.id;
  if(S.role==='sup'&&!S.seeded&&!S.tasks.some(t=>!t.del&&t.date===S.date)){genDay(S.date);S.seeded=true}
  UI.tab=S.role==='sup'?'hoy':'ruta';save();$('#sheet').classList.remove('on');render()},
 day:el=>{const n=+el.dataset.n;S.date=n===0?todayStr():addDays(S.date,n);
  if(isSup()&&n!==0&&S.date>=todayStr()&&!S.tasks.some(t=>t.date===S.date&&!t.del))genDay(S.date);save();render()},
 mode:el=>{UI.mode=el.dataset.m;render()},
 gmode:el=>{UI.gmode=el.dataset.m;render()},
 zone:el=>zoneSheet(el.dataset.z),
 hideNote:()=>{S.hideNote=true;save();render()},
 filter:el=>{UI.filter=UI.filter===el.dataset.f&&el.dataset.f!=='todas'?'todas':el.dataset.f;render()},
 range:el=>{UI.range=el.dataset.r;render()},
 acc:el=>{UI.open[el.dataset.id]=!UI.open[el.dataset.id];render()},
 taskOpen:el=>taskSheet(el.dataset.id),
 st:el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.s=el.dataset.s;if(!t.startAt)t.startAt=Date.now();pt(t);save();render();toast('Tarea iniciada')},
 finishOpen:el=>finishSheet(el.dataset.id),
 phDel:el=>{UI.shot.photos.splice(+el.dataset.i,1);shotUI()},
 sendVal:el=>{
  const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t||!UI.shot)return;
  t.ph=UI.shot.photos.slice();t.note=($('#ph-note')&&$('#ph-note').value.trim())||t.note;t.s='R';t.doneAt=Date.now();t.submitCount=(t.submitCount||0)+1;
  UI.shot=null;pt(t);save();$('#sheet').classList.remove('on');render();toast('Enviada a validar')},
 newTask:el=>sheet(taskForm(null,el.dataset&&el.dataset.z)+`<button class="btn pri full" data-act="saveTask">Crear tarea</button>`),
 saveTask:el=>{
  const id=el.dataset.id;const f={type:$('#t-type').value,zone:$('#t-zone').value,who:$('#t-who').value,time:toMin($('#t-time').value),note:$('#t-note').value.trim(),crit:$('#t-crit').checked};
  let t;
  if(id){t=S.tasks.find(x=>x.id===id);Object.assign(t,f);if($('#t-st'))t.s=$('#t-st').value}
  else{t=Object.assign({id:uid(),date:S.date,s:'P',q:null,ck:{},fails:[],ph:[],carry:0,createdAt:Date.now(),del:false},f);S.tasks.push(t)}
  pt(t);save();closeSheet();render();toast('Guardado')},
 carry:el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);const c=S.team.filter(p=>p.turno==='T1'||p.turno==='T2');
  const l=p=>dayTasks().filter(x=>x.who===p.id&&isOpen(x)).length;c.sort((a,b)=>l(a)-l(b));
  if(c[0])t.who=c[0].id;t.carry=(t.carry||0)+1;t.lastCarryAt=Date.now();t.time=Math.max(t.time,840);pt(t);save();closeSheet();render();toast(c[0]?'Pasó a '+c[0].name:'Pasó a la tarde')},
 delAsk:el=>sheet(`<h3>¿Eliminar esta tarea?</h3><div class="row"><button class="btn bad grow" data-act="del" data-id="${el.dataset.id}">Sí, eliminar</button><button class="btn grow" data-act="close">Cancelar</button></div>`),
 del:el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);t.del=true;t.ph=[];pt(t);save();closeSheet();render()},
 vOpen:el=>validateSheet(el.dataset.id),
 ck:el=>{UI.ck[el.dataset.k]=el.dataset.v;$('#ckl').innerHTML=ckHtml();ckBtns($('#vbtn').querySelector('[data-id]').dataset.id)},
 ckAll:el=>{CHECKS.forEach(c=>UI.ck[c[0]]='ok');$('#ckl').innerHTML=ckHtml();ckBtns(el.dataset.id)},
 vRes:el=>{const t=S.tasks.find(x=>x.id===el.dataset.id),r=el.dataset.r;
  t.ck=Object.assign({},UI.ck);t.q=r;t.note=r==='cumple'?t.note:($('#v-note').value.trim()||t.note);
  t.fails=CHECKS.map(c=>c[0]).filter(k=>UI.ck[k]==='fail');t.lastReviewedAt=Date.now();
  if(r==='cumple'){t.s='V';t.validatedAt=Date.now()}else{t.s='C';t.corrections=(t.corrections||0)+1}
  pt(t);save();closeSheet();render();toast(r==='cumple'?'Validada':'Devuelta para corregir')},
 genAsk:()=>sheet(`<h3>Generar plan de ${fmtD(S.date)}</h3><div class="small">Genera un plan balanceado por <b>carga relativa</b>, turnos, ventas y quiebres. Si ya existen tareas de este día, se reemplazarán; evita regenerar después de iniciar la operación.</div><div class="row"><button class="btn pri grow" data-act="gen">Generar</button><button class="btn grow" data-act="close">Cancelar</button></div>`),
 gen:()=>{genDay(S.date);save();closeSheet();UI.tab='hoy';render();toast('Plan generado')},
 editPerson:el=>personSheet(el.dataset.id),
 savePerson:el=>{const n=$('#pe-n').value.trim(),t=$('#pe-t').value;if(!n){toast('Escribe un nombre');return}
  const u=$('#pe-u').value.trim(),em=u?toEmail(u):'';
  if(el.dataset.id){const p=person(el.dataset.id);p.name=n;p.turno=t;p.email=em}else S.team.push({id:'p'+uid(),name:n,turno:t,email:em});
  S.hideNote=true;pteam();save();closeSheet();render();toast('Guardado')},
 copyPlan:el=>copyText(planText(el.dataset.id)),
 syncSheet:syncSheet,
 packCopy:()=>copyText(pack()),
 packIn:()=>{const n=unpack($('#pkin').value);if(n<0)toast('El paquete no es válido');else{closeSheet();render();toast(n+' cambios aplicados')}},
 incNew:incSheet,
 logout:()=>{PEND.clear();S.role=null;S.me=null;S.tasks=[];S.inc=[];S.team=defaultTeam();S.teamU=0;setData(null);save();if(AUTH)AUTH.signOut()},
 dataSheet:()=>sheet(`${head('Cargar datos de ventas')}<div class="small mut">Elige el archivo <b>datos_ventas.json</b>. Se guarda en tu base de datos y los gestores solo reciben el orden de ventas, sin montos.</div><label class="shot" for="up-in">Elegir archivo</label><input class="vh" type="file" accept=".json,application/json" id="up-in" data-chg="dataUp">`),
 incAdd:()=>{const i={id:uid(),d:todayStr(),t:$('#i-t').value,z:$('#i-z').value,c:$('#i-c').value,sku:$('#i-s').value.trim(),n:$('#i-n').value.trim(),by:isSup()?'':S.me,fixed:false,del:false};S.inc.push(i);pi(i);save();closeSheet();render();toast('Incidencia guardada')},
 incFix:el=>{const i=S.inc.find(x=>x.id===el.dataset.id);i.fixed=true;i.fixedAt=Date.now();pi(i);save();render()},
 targetSheet:()=>sheet(`${head('Metas de control')}<div class="note">Metas provisionales. Ajusta después de obtener una línea base real.</div><div class="grid2"><label class="f">Cumplimiento mínimo %<input type="number" id="tg-plan" min="0" max="100" value="${S.targets.plan}"></label><label class="f">Críticas a tiempo %<input type="number" id="tg-crit" min="0" max="100" value="${S.targets.crit}"></label><label class="f">Primera pasada %<input type="number" id="tg-fpy" min="0" max="100" value="${S.targets.fpy}"></label><label class="f">Traspaso máximo %<input type="number" id="tg-carry" min="0" max="100" value="${S.targets.carry}"></label><label class="f">Validación ≤30 min %<input type="number" id="tg-sla" min="0" max="100" value="${S.targets.sla}"></label></div><button class="btn pri full" data-act="saveTargets">Guardar metas</button>`),
 saveTargets:()=>{const n=id=>Math.max(0,Math.min(100,+$(id).value||0));S.targets={plan:n('#tg-plan'),crit:n('#tg-crit'),fpy:n('#tg-fpy'),carry:n('#tg-carry'),sla:n('#tg-sla')};save();closeSheet();render();toast('Metas actualizadas')},
 startSheet:()=>sheet(`${head('Inicio del plan 30-60-90')}<label class="f">Fecha de inicio<input type="date" id="st-d" value="${S.start}"></label><button class="btn pri full" data-act="saveStart">Guardar</button>`),
 saveStart:()=>{S.start=$('#st-d').value||todayStr();save();closeSheet();render()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const el=e.target.closest('[data-act]');
  if(el){const f=ACTS[el.dataset.act];if(f)f(el,e);return}
  const g=e.target.closest('svg g[data-z]');if(g)zoneSheet(g.dataset.z);
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg;
  if(k==='date'){if(el.value){S.date=el.value;save();render()}}
  else if(k==='tType'){const T=TYPES[el.value];$('#t-crit').checked=T.p==='critica'}
  else if(k==='incT'){UI.incType=el.value;$('#i-c').innerHTML=CAUSES[el.value].map(c=>`<option>${c}</option>`).join('')}
  else if(k==='dataUp'){
    const f=el.files[0];el.value='';if(!f||!DB||!canSup())return;
    try{const o=JSON.parse(await f.text());if(!o.gestor||!o.sup)throw 0;
      await DB.doc('datos/gestor').set(clone(o.gestor));await DB.doc('datos/sup').set(clone(o.sup));
      setData(clone(o.sup));closeSheet();render();toast('Datos de ventas cargados')}
    catch(err){toast('No se pudo cargar el archivo')}
  }
  else if(k==='photo'){
    const files=[...el.files];el.value='';
    for(const f of files){if(!UI.shot)return;if(UI.shot.photos.length>=3){toast('Máximo 3 fotos');break}
      try{UI.shot.photos.push(await readPhoto(f))}catch(err){toast('No se pudo leer la foto')}}
    if(UI.shot)shotUI();
  }
});
render();
boot();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(!$('#sheet').classList.contains('on')&&S.role)softRender()},60000);
</script>
